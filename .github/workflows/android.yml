name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write # move the rolling tag + publish the release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app (tsc --noEmit + vite build)
        run: npm run build

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v4

      # Optional: sign with your own key. Add repo secrets ANDROID_KEYSTORE_BASE64
      # (base64 of the .jks/.keystore), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
      # ANDROID_KEY_PASSWORD. Without them the committed dev keystore is used
      # (see android/app/build.gradle).
      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using keystore from secrets."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret; using committed dev keystore."
          fi

      - name: Build release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename and verify APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DungeonDelve.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$APKSIGNER" verify --print-certs DungeonDelve.apk
          ls -l DungeonDelve.apk

      - uses: actions/upload-artifact@v7
        with:
          name: DungeonDelve-${{ github.run_number }}
          path: DungeonDelve.apk
          if-no-files-found: error

      - name: Compute rolling release tag
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          SAFE="$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')"
          echo "tag=latest-$SAFE" >> "$GITHUB_OUTPUT"

      # Point the rolling tag at this commit (a release keeps its old commit otherwise)
      # and drop the previous APK so re-runs never collide with an existing asset.
      - name: Move tag and clear old asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" DungeonDelve.apk --yes || true
          fi

      - name: Publish rolling pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Dungeon Delve (latest ${{ github.ref_name }} build)
          prerelease: true
          make_latest: false
          files: DungeonDelve.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            Latest Android build of **${{ github.ref_name }}** — commit ${{ github.sha }}, build #${{ github.run_number }} (versionCode ${{ github.run_number }}).

            **Direct download:** ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/DungeonDelve.apk

            ### Install on your Android phone (e.g. Pixel)
            1. Open this page in Chrome on the phone and tap **DungeonDelve.apk** under *Assets*.
            2. When the download finishes, tap **Open**. If Android asks, allow **Install unknown apps** for Chrome (Settings → Apps → Chrome → Install unknown apps).
            3. Tap **Install** (or **Update** if an older build is installed — your save data is kept). If Play Protect warns about an unknown developer, choose **More details → Install anyway**.
            4. Launch **Dungeon Delve** from the app drawer. It runs fullscreen in landscape and works offline.

            This release is replaced by every new push to `${{ github.ref_name }}`.
